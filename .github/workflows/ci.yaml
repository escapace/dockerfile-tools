name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.2
          cache: true
      - name: Run tests
        run: go test ./...
